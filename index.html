<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>GitHub Fun Time</title>
</head>

<body>
    <canvas id="heat" class="heat" aria-hidden="true"></canvas>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" id="glow" aria-hidden="true"></div>
    <canvas id="rain" class="rain" aria-hidden="true"></canvas>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
    <canvas id="walker" class="walker" aria-hidden="true"></canvas>

    <main>
        <p class="badge">
            <span class="dot"></span>
            <span id="badge-label">live on git</span>
        </p>
        <h1 id="title">GitHub Fun Time</h1>
        <p class="lede" id="lede">This is a fun time with GitHub</p>
        <button type="button" id="fun-btn">Fun Time</button>
        <p class="hint" id="hint">commit · push · smile</p>
        <p class="combo" id="combo" hidden></p>
    </main>

    <div class="ground" aria-hidden="true"></div>
    <div class="terminal" id="terminal" aria-live="polite"></div>
    <script src="app.js" defer></script>
</body>

</html>
